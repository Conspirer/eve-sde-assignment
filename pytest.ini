[pytest]
testpaths = tests
filterwarnings =
    # SQLite has no real DECIMAL type; Postgres does. Harmless in tests.
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal:Warning
    # Library-internal deprecation notice from Starlette's TestClient.
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx` with `starlette.testclient`:Warning
